# SOPS creation rules for this demo workspace.
#
# Safe to commit: it contains only *public* age recipients. The matching private key lives outside the
# repo, at the path SOPS_AGE_KEY_FILE names, and is what decrypts.
#
# Why this file is needed at all: SOPS_AGE_KEY_FILE tells SOPS how to *decrypt*. Encrypting needs a
# recipient — a public key — and SOPS takes that either from a creation rule here or from an explicit
# `--age` argument. Without this file, `sops --encrypt` fails with "no creation rules", which says nothing
# about a missing public key.
creation_rules:
  # Everything under secrets/. `encrypted_regex` is deliberately absent, so every value is encrypted
  # rather than a named subset — a rule that encrypts only fields matching a pattern silently leaves a
  # new field in the clear the moment someone names it something unexpected.
  - path_regex: secrets/.*\.sops\.yaml$
    age: age1t3qkpfqaj927jn38ecx8qvk4e9qwn86lft84kpscgxgyqalp9gzs97hl32
