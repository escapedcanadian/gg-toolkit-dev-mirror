# Bumped by hand. The generator's ConfigMigrationRunner would do it on first run, but it rewrites
# this file through SnakeYAML and drops every comment in it — and this file is mostly comments
# recording which broker address belongs to which vantage point, so losing them is expensive.
#
# AT 7 as of 2026-08-25. v7 REMOVES the top-level `targets:` block and the per-scenario `target:`
# key: the cluster a run writes to is now chosen at launch (`--targetCluster` on the CLI, or the UI
# Load page's target selector) rather than declared here. Both are gone from this file, and the
# cluster names they carried are recorded where the block used to be — that mapping exists nowhere
# else now, so do not delete it without moving it somewhere.
#
# v6 was the other non-no-op step: it makes `histogram_highest_ms` and
# `histogram_significant_digits` REQUIRED inside `metrics:`, and both are set below. Steps v1..v5
# were documented no-ops apart from the version pointer (v4 added an optional `metrics:` block, v5 an
# optional `control:` block), which is why those hand-bumps were exactly equivalent to running the
# migration.
#
# PREREQUISITE, and it is a real one: the generator archive installed on the hosts must be built from
# `feat/load-generator-control` at or after 2026-08-22, when v7 landed. An older archive rejects this
# file outright ("only supports up to schema_version N") and the run fails at config parse, before it
# starts.
#
# If an older archive is ever redeployed to these hosts, drop this back to the version that archive
# supports and undo the matching features together — at 6, restore a `targets:` block and a `target:`
# on every scenario; at 5, also delete the two histogram keys below. The version and its features
# must move together, or the generator rejects the file on startup. 5 is the floor while the
# `control:` block below is present, since that block is a v5 feature.
schema_version: 7

# Live throughput/latency export, and runtime rate control, for the UI's Load page (/load).
# Both are optional and both are commented out here because the address depends on the demo:
# `kafka_bootstrap` is resolved from the GENERATOR's vantage point, so an in-cluster run wants the
# cluster-internal broker DNS while a local run wants a reachable one. The UI uses its own separate
# address (`uiKafkaBootstrap` in gradle.properties) — do not reuse this value for it.
#
# vm04's address: the broker (message_brokers.payments-bus) runs on the same machine as this
# generator, so this is the generator's own vantage point. The UI needs its own setting
# (uiKafkaBootstrap in gradle.properties) — in this lab the address happens to be identical because
# the VMs have routable IPs, which is a property of this lab and not a rule.
#
# `metrics:` is a v4 feature, so it is valid at the pinned version above. It still produces nothing
# the UI can use until the installed generator archive is rebuilt from a branch carrying `runGroup`
# on MetricsSnapshot: the UI aggregates by that field and drops snapshots without it, rather than
# guessing which run a snapshot belongs to.
metrics:
  kafka_bootstrap: "129.40.56.113:9092"
  topic: "datagen-metrics"
  interval_ms: 1000
  # Whole-run latency histogram, published on this same topic alongside the interval figures. The UI
  # merges the per-instance histograms into the fleet percentiles a completed run card shows —
  # merges, because percentiles do not compose: the max p90 across instances is the worst instance's
  # p90, not the fleet's. Both keys are REQUIRED from ops v6.
  #
  # 60000ms is the recommended ceiling: an operation slower than a minute is pathological for a load
  # test, and one that exceeds the ceiling is clamped to it rather than dropped, so a p99 pinned at
  # 60000 reads as "slower than we can measure" rather than silently vanishing.
  #
  # 3 significant digits is HdrHistogram's standard 0.1% precision. The valid range is 1-4, capped at
  # 4 because each extra digit costs roughly 100x more histogram memory per tick — 3 digits is about
  # 280KB/sec per instance, 5 would have been ~21MB/sec. The ceiling above is nearly free by
  # comparison, since memory is logarithmic in it.
  histogram_highest_ms: 60000
  histogram_significant_digits: 3

# Runtime rate control for the Load page's slider. Requires ops schema_version 5, which the archive
# now installed on vm04 provides — see the version note at the top of this file.
#
# Same vantage-point rule as `metrics:` above: this address is resolved by the GENERATOR, and the UI
# uses its own `uiKafkaBootstrap`. They are identical here only because these VMs have routable IPs.
control:
  kafka_bootstrap: "129.40.56.113:9092"
  topic: "datagen-control"

# OpenTelemetry export of the generator's own instruments (in-flight, op duration histogram,
# errors, target rate, observed rate). This is the Power lab's metrics path: it needs no Kafka,
# unlike the `metrics:`/`control:` blocks above, which exist only to drive the UI's Load page.
#
# The endpoint is the otelcol receiver stood up by the `power-monitoring` monitor on vm04, the
# same collector the GG8 cluster exports to via host_otel_endpoint in cluster_templates.power-gg8.
# From there: otelcol -> Prometheus (:9090) -> Grafana (:3000).
#
# NOTE THE PORT: 4318, not 4317. The generator's OTLP exporter is HTTP-based (okhttp), so it must
# talk to the collector's OTLP/HTTP receiver on 4318. Pointing it at 4317 — the gRPC receiver the
# GG8 cluster uses via host_otel_protocol: GRPC — makes the collector reset the connection and
# every export fails with "Failed to export metrics ... Connection reset". Same collector, two
# receivers, one port each.
otel:
  exporter: otlp
  endpoint: http://129.40.56.113:4318

# The `targets:` block that stood here was deleted by the v6 -> v7 hand-migration. v7 chooses the
# cluster at launch instead — `--targetCluster` on the generator CLI, or the UI Load page's target
# selector — so a scenario no longer names one. The cluster names those targets carried, which are
# now what you pass at launch, were:
#
#   gg8-trip        gg8-kv  example-gcp-8a
#   gg9-trip        gg9-kv  template-aws-9a
#   power-demo-gg8  gg8-kv  power-demo     <- the Power lab's GG8 cluster
#
# A cluster name is still the lookup key into client-endpoints.yaml, so whatever you pass must match
# the clusters entry in the demo config exactly — a mismatch is reported by DemoAddressFinder on the
# machine, not here.
#
# Which scenario below used which, before the target: lines were removed:
#   customer-load           template-aws-9a
#   gg8-verify              example-gcp-8a
#   gg8-distributed-verify  example-gcp-8a
#   power-load              power-demo
scenarios:
  - name: customer-load
    root_schemas: [customer]
    rate: { kind: constant, ops_per_second: 50 }
    duration: { kind: count, value: 200 }
    provisioning: apply
    read_ratio: 0.10
  - name: gg8-verify
    root_schemas: [customer]
    rate: { kind: constant, ops_per_second: 20 }
    duration: { kind: count, value: 200 }
    provisioning: apply
    read_ratio: 0.10
  - name: gg8-distributed-verify
    root_schemas: [customer]
    rate: { kind: constant, ops_per_second: 20 }
    duration: { kind: count, value: 200 }
    provisioning: apply
    read_ratio: 0.10
    distribution: { replicas: 2, partition_count: 2 }
  # Plan Task 10's validation run. Deliberately small and bounded: this is proving that the archive
  # installed, the JDK runs it, and DemoAddressFinder resolved the cluster — not measuring anything.
  # No 'distribution' block: a host generator is a single JVM under systemd, so there is no second
  # replica to partition work across.
  #
  # Any throughput read off this lab is contended — the generator shares vm04's 64 CPUs with the
  # Prometheus and Grafana measuring the demo. Do not quote a number from here as a clean benchmark.
  - name: power-load
    root_schemas: [customer]
    rate: { kind: constant, ops_per_second: 50 }
    duration: { kind: count, value: 2000 }
    provisioning: apply
    read_ratio: 0.10
