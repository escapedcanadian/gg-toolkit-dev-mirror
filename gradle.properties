# Demo Directories and Configuration Files
# The demo configuration file location must be specified here (or via -PdemoConfigFile=...).
# All other operational paths (output, runtime, working directories) are now defined in
# the demo configuration file's 'demo' section, making the system usable without Gradle.
# To override config file paths from Gradle, set demoOutputDirectory, demoRuntimeDirectory,
# or demoWorkingDirectory here — they take precedence over config file values.

# Demo primary configuration file
demoConfigFile=src/main/resources/demo-config.yaml

# Output directory — REQUIRED, and it pins every configuration at once.
#
# The header above says the config file's `demo.output_directory` defines this. For Gradle-driven
# runs it does not: the task fails outright with "demoOutputDirectory project property must be
# set" if this is absent, and when present it outranks whatever the config says. So the key in
# demo-config*.yaml is documentation, not the effective value.
#
# Set to the Power demo's directory because that is the active demo and its deployed cluster
# already wrote client-endpoints.yaml there. **Change this when switching demos** —
# demo-config.yaml expects build/gridgain/output.
#
# Do NOT instead pass -PdemoOutputDirectory to launchPluginUi. The UI forwards -PdemoConfigFile to
# the subprocesses it launches but not the output directory, assuming a subprocess reads the same
# gradle.properties it did. An override that is not in this file breaks that assumption: in-process
# actions use the override while subprocesses fall back to here. That is exactly how a deployed
# cluster wrote client-endpoints.yaml under output-power while `dataGenerate` looked under output
# and reported the cluster had never been deployed.
demoOutputDirectory=build/gridgain/output-power

# Data configuration files
#baseDataConfigFile=src/main/resources/data/base-data.yaml
#streamDataConfigFile=src/main/resources/data/stream-data.yaml
#dataResourcesDirectory=src/main/resources/data

# Kafka broker for the UI's Load page (/load), which drives the data generator's rate live and
# graphs its throughput/latency. Optional: leave it unset and the page reports itself unconfigured;
# everything else in the UI works regardless.
#
# This address must be reachable FROM THE MACHINE RUNNING THE UI. It is deliberately separate from
# the generator's ops.yaml `kafka_bootstrap`, which is resolved from the generator's vantage point
# (cluster-internal DNS for an in-cluster run, which a laptop cannot dial). The generator's ops.yaml
# also needs `metrics:` and `control:` blocks for the page to have anything to talk to.
uiKafkaBootstrap=129.40.56.113:9092

# Suppress deprecation warnings - they're just noise unless building
org.gradle.warning.mode=none


# Refresh plugin dependencies more frequently
org.gradle.caching=false

# Heap for the Kotlin compile daemon that compiles THIS build's Kotlin source.
#
# It does not reach the plugin or the UI: both are pulled in with `includeBuild`, and an included
# build reads its own gradle.properties. Each of those sets the same value in its own file, which is
# the only place it takes effect for their compiles — an earlier attempt to cover them from here
# looked correct and did nothing, while the Kotlin daemon ran on a 512m default and
# `:gridgain-demo-gradle-plugin:compileKotlin` died with "Not enough memory to run compilation".
#
# A -D on the command line cannot fix it: that reaches the Gradle JVM, not the Kotlin daemon.
# Kept identical to the included builds' value so all three share one daemon rather than one each.
kotlin.daemon.jvmargs=-Xmx3g