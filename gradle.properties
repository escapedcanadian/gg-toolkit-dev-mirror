# Demo Directories and Configuration Files
# The demo configuration file location must be specified here (or via -PdemoConfigFile=...).
# All other operational paths (output, runtime, working directories) are now defined in
# the demo configuration file's 'demo' section, making the system usable without Gradle.
# To override config file paths from Gradle, set demoOutputDirectory, demoRuntimeDirectory,
# or demoWorkingDirectory here — they take precedence over config file values.

# Demo root directory. Use '.' or omit to use the project root
demoRootDirectory=.

# Demo primary configuration file
demoConfigFile=src/main/resources/demo-config.yaml

# Output directory (explicit - matches plugin default)
demoOutputDirectory=build/gridgain/output

# Data configuration files
#baseDataConfigFile=src/main/resources/data/base-data.yaml
#streamDataConfigFile=src/main/resources/data/stream-data.yaml
#dataResourcesDirectory=src/main/resources/data

# Kafka broker for the UI's Load page (/load), which drives the data generator's rate live and
# graphs its throughput/latency. Optional: leave it unset and the page reports itself unconfigured;
# everything else in the UI works regardless.
#
# This address must be reachable FROM THE MACHINE RUNNING THE UI. It is deliberately separate from
# the generator's ops.yaml `kafka_bootstrap`, which is resolved from the generator's vantage point
# (cluster-internal DNS for an in-cluster run, which a laptop cannot dial). The generator's ops.yaml
# also needs `metrics:` and `control:` blocks for the page to have anything to talk to.
uiKafkaBootstrap=129.40.56.113:9092

# Suppress deprecation warnings - they're just noise unless building
org.gradle.warning.mode=none


# Refresh plugin dependencies more frequently
org.gradle.caching=false

# This project pulls the plugin in via includeBuild, so invoking any task here also compiles the
# plugin's Kotlin source. The Kotlin compile daemon's default heap is no longer enough for it — the
# compile dies with "GC overhead limit exceeded" / "Not enough memory to run compilation". The
# plugin's own gradle.properties sets org.gradle.jvmargs, which covers building it directly but does
# not reach the Kotlin daemon of an included build invoked from here.
#
# A -D on the command line does NOT work for this: it reaches the Gradle JVM, not the Kotlin daemon.
# It must be a project property, so gradle.properties (or -P) is the only route.
kotlin.daemon.jvmargs=-Xmx3g